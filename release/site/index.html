<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>让对话长成一片菜园 · 青云桌面菜园</title><style>body{margin:0;background:#25252f;color:#f6eac3;font:17px/1.8 system-ui,sans-serif}main{max-width:840px;margin:auto;padding:64px 24px}nav a{margin-right:24px}a{color:#bdd078}h1{font-size:42px;line-height:1.25}h2{color:#f5c86c}figure{background:#36343a;padding:24px;border:2px solid #706c55;margin:32px 0}img{max-width:100%;image-rendering:pixelated}footer{margin-top:64px;color:#c3ba8b;border-top:2px solid #706c55;padding-top:20px}.tag{color:#bdd078}</style><main><nav><a href="index.html">菜园</a><a href="privacy.html">隐私</a><a href="terms.html">使用条款</a><a href="support.html">帮助</a></nav><p class="tag">Windows · 二维像素桌面伙伴</p><h1>让对话长成<br>桌面上的一片菜园。</h1><p>一颗种子，一轮工作。让生长、成熟和微光，陪你看见对话的变化。</p><figure><img src="garden.png" alt="演示菜园：像素园丁、蔬菜、太阳和收藏箱"><figcaption>示例画面，不含真实对话。</figcaption></figure><h2>轻轻照料，继续专注</h2><p>点击走近，双击收获并回到对话。给植物浇水、施肥，收藏特殊品种；这些互动不会改变真实工作进度。</p><h2>留在本机，融入桌面</h2><p>透明区域支持鼠标穿透，不抢键盘输入。拖动太阳就能移动菜园。首次确认后才读取本机 Codex 数据，无广告与遥测。</p><p>成熟代表观察到一轮完成，不等于任务验收通过。需要 Windows x64 与 Codex 桌面版。</p><footer>青云桌面菜园 · risu1</footer></main></html>
