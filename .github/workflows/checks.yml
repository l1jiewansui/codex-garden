name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -X utf8 -m unittest discover -s tests -v
      - run: node tests/world.test.cjs
      - run: node tests/desktop.test.cjs
      - run: node tests/update.test.cjs
      - run: node --check main.cjs
      - run: node --check qa.cjs
      - run: node --check web/pet.js
