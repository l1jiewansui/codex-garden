name: Update star history
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: star-history
  cancel-in-progress: false
jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Collect real star count and render chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m pip install matplotlib==3.10.8
          python tools/update_star_history.py
      - name: Save updated chart
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/metrics/star-history.json docs/metrics/star-history.svg docs/metrics/star-history-dark.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: update star history'
          git pull --rebase origin main
          git push origin HEAD:main
