<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self'; script-src 'self'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>青云菜园 · 横版世界</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><span>✿</span><strong>青云菜园</strong><small>THE CONVERSATION GROVE / 02</small></div><nav><button id="pin">置顶</button><button id="compact">小窗</button><button id="minimize" aria-label="最小化">─</button><button id="hide" aria-label="隐藏到托盘">×</button></nav></header>
<main><section class="hud"><div class="title"><span class="eyebrow">一段对话，一方田园</span><h1>在等待的间隙，看世界生长。</h1></div><div class="stats"><span><b id="growing">0</b> 生长中</span><span class="gold"><b id="ripe">0</b> 可收获</span><span><b id="care">0</b> 需留意</span><span><b id="harvests">0</b> 已收下</span></div></section>
<section class="toolbar"><div class="filters"><button data-filter="all" class="active">全部菜田</button><button data-filter="growing">生长中</button><button data-filter="ripe">成熟了</button><button data-filter="care">需留意</button></div><div class="settings"><label>园丁 <select id="hero"></select></label><label>天色 <select id="theme"><option value="dusk">暮色</option><option value="day">晨光</option><option value="night">月夜</option></select></label><button id="list-toggle">对话目录</button></div></section>
<div id="notice" role="status"></div><section id="world-wrap" aria-label="横版菜园"><div id="world"></div><div class="world-top"><span id="world-label">青云林地 · 本地菜园</span><span id="clock"></span></div><div id="world-empty" hidden>还没有菜田。开始一段 Codex 对话，种下第一颗种子。</div><div id="toast" role="status"></div><div class="world-bottom"><span>← → / A D 行走 · 空格跳跃 · 拖动看风景</span><button id="follow">跟随园丁</button><button id="next-ripe">去收菜 →</button></div></section>
<section class="navigation"><button id="west" aria-label="向左浏览">←</button><div class="overview"><div id="markers"></div><input type="range" id="position" min="0" max="1000" value="0" aria-label="横向浏览菜园"></div><button id="east" aria-label="向右浏览">→</button><span id="plot-count">0 块田</span></section><footer><span id="sync">正在连接本地 Codex…</span><span>像素角色工坊 × 横版生活</span><button id="refresh">同步</button><button id="demo">体验演示</button></footer></main>
<aside id="drawer" hidden><div class="drawer-head"><h2>对话与菜田</h2><button id="list-close">关闭</button></div><p>点击条目，园丁会带你走到对应菜田。</p><div id="thread-list"></div></aside>
<dialog id="detail"><button id="close-detail" class="close" aria-label="关闭详情">×</button><span class="eyebrow" id="detail-state"></span><h2 id="detail-title"></h2><p id="detail-project"></p><pre id="detail-summary"></pre><div class="dialog-actions"><button id="open-thread">打开 Codex 对话</button><button id="harvest" class="primary">收下这一茬</button></div><p class="muted">收菜保存在本机。下一轮请求会在原来的菜田重新播种。</p></dialog>
<script src="vendor/phaser.min.js"></script><script src="model.js"></script><script src="world.js"></script><script src="app.js"></script></body></html>
