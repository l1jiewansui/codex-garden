<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>青云桌面菜园</title><link rel="stylesheet" href="pet.css"><link rel="stylesheet" href="art-v04.css"><link rel="stylesheet" href="pixel-v04.css"></head><body>
<section id="welcome" hidden data-hit><h2 id="welcome-title">欢迎来到我的菜园</h2><p>把对话变成一片小菜地。</p><p>菜园会读取这台电脑上的 Codex 对话状态和名称。内容留在本机，不上传；收藏也只保存在你的电脑上。</p><p>拖动太阳移动菜园，单击地面走动。双击成熟植物收获并查看对话，悬停可以浇水、施肥。</p><button id="begin">开始种菜</button></section><section id="panel" hidden data-hit><header><canvas id="app-mark" width="24" height="24"></canvas><button id="back" hidden>‹ 返回</button><strong id="panel-title">我的菜园</strong><button id="rename-garden" title="修改菜园名称">改名</button><button id="close" aria-label="收起面板">×</button></header><form id="name-editor" hidden data-hit><label for="garden-name-input">菜园名称</label><input id="garden-name-input" maxlength="48" autocomplete="off" placeholder="我的菜园"><button type="submit">保存</button><button type="button" id="cancel-name">取消</button><small>最多24个字，留空恢复默认名称。</small></form><div id="list-view"><p id="sync" hidden>正在读取本地对话…</p><p id="attention-legend" hidden>蓝点：未读　无点：已读　空心：待确认</p><div id="threads"></div></div><div id="detail-view" hidden><small id="status"></small><h2 id="title"></h2><p id="project" hidden></p><pre id="summary" hidden></pre><div class="actions"><button id="open-thread">查看对话</button><button id="harvest" class="primary">收下这一茬</button></div></div><div id="storage-view" hidden><p id="storage-caption"></p><div id="storage-items"></div></div><section id="gardener-workshop" hidden><div class="workshop-scroll"><div id="workshop-presets" aria-label="园丁样式"></div><div class="workshop-body"><div class="workshop-visual"><canvas id="workshop-preview" width="96" height="96"></canvas><canvas id="reference-photo" width="80" height="80" aria-label="本机参考照片" hidden></canvas></div><div><div id="workshop-fields"></div><label><input id="recipe-beard" type="checkbox"> 胡须</label></div></div><section id="workshop-picker" hidden aria-label="选择外观选项"><div class="picker-heading"><strong id="picker-title"></strong><button id="picker-close" aria-label="关闭选项">×</button></div><div id="picker-options"></div></section><small id="workshop-status" role="status" aria-live="polite">选择样式后可继续调整脸型与服装；照片仅建议配色和发型。</small></div><div class="workshop-actionbar"><div class="preview-actions"><button data-preview-action="idle">站立</button><button data-preview-action="walk">走路</button><button data-preview-action="water">浇水</button><button data-preview-action="feed">施肥</button></div></div><div class="workshop-footer"><button id="workshop-undo" aria-label="撤销外观修改" title="撤销">↶</button><button id="workshop-redo" aria-label="重做外观修改" title="重做">↷</button><button id="workshop-reset" title="恢复打开工坊时的外观">还原</button><button id="workshop-photo" title="在本机参考照片配色，不上传">照片参考</button><button id="workshop-cancel">取消</button><button id="workshop-apply">应用园丁</button></div></section><div id="settings"><span>园丁</span><div id="heroes"></div><button id="photo-gardener" title="本机搭配园丁，预览完整动作">园丁工坊</button><input id="gardener-photo-file" type="file" accept="image/png,image/jpeg,image/webp" hidden><button id="demo" hidden>演示</button><button id="pass" hidden title="全部鼠标穿透；从托盘菜单恢复交互">穿透</button></div><p id="error" role="status"></p></section>
<section id="pet"><div id="sun-anchor" data-hit title="按住太阳拖动整个菜园" aria-label="拖动菜园的像素太阳"><canvas id="sun" width="32" height="32"></canvas></div><canvas id="garden" width="210" height="75" aria-label="透明桌面园丁与菜田"></canvas><canvas id="plant-fx" width="420" height="150" aria-hidden="true"></canvas><div id="hero-drag" title="拖动园丁移动桌宠"></div><div id="drag" data-hit title="按住这里拖动桌宠"><canvas id="drag-mark" width="24" height="24"></canvas></div><button id="storage" data-hit title="储物收藏" aria-label="打开储物收藏"><canvas id="chest" width="28" height="28"></canvas></button><div id="capsule" data-hit><canvas id="mini-mark" width="24" height="24" title="按住拖动整个桌面菜园"></canvas><button id="overview" title="查看全部对话"><span id="growing" hidden>0</span>公告 <b id="ripe">0</b></button><button id="prev" aria-label="向左查看连续菜地">‹</button><span id="page">1/1</span><button id="next" aria-label="向右查看连续菜地">›</button><button id="menu" title="打开对话与设置">⋯</button></div><div id="plant-info" hidden data-hit><strong id="info-title"></strong><div id="info-row"><small id="info-status"></small><button id="change-plant" title="选择植物品种">换植物</button></div></div><div id="care-tools" hidden data-hit aria-label="照料植物"><button id="water" title="浇水"><span aria-hidden="true">◒</span> 浇水</button><button id="feed" title="施肥"><span aria-hidden="true">▣</span> 施肥</button></div><div id="hint" hidden></div><div id="toast" hidden role="status"></div></section>
<script src="model.js"></script><script src="gardener-studio.js"></script><script src="pet.js"></script></body></html>
